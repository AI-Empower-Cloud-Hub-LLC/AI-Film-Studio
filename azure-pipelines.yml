trigger:
  branches:
    include:
    - main
    - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  ACR_NAME: 'aifilmstudioacr'
  RESOURCE_GROUP: 'ai-film-studio-rg'
  BACKEND_APP: 'ai-film-studio-backend'
  FRONTEND_APP: 'ai-film-studio-frontend'
  BACKEND_IMAGE: 'aifilmstudioacr.azurecr.io/ai-film-studio-backend'
  FRONTEND_IMAGE: 'aifilmstudioacr.azurecr.io/ai-film-studio-frontend'
  DOCKER_BUILDKIT: 1

stages:
  - stage: Test
    displayName: 'Run Tests'
    jobs:
      - job: BackendTests
        displayName: 'Backend Tests'
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'
            displayName: 'Set up Python'

          - script: |
              cd backend
              pip install -r requirements.txt
            displayName: 'Install backend dependencies'

          - script: |
              cd backend
              pytest tests/ -v --tb=short --cov=app --cov-report=xml
            displayName: 'Run backend tests'
            env:
              SECRET_KEY: 'test-secret-key-for-ci'
              OPENAI_API_KEY: 'test-key'
              DATABASE_URL: 'sqlite:///./test.db'
              REDIS_URL: 'redis://localhost:6379/0'

          - task: PublishCodeCoverageResults@1
            inputs:
              codeCoverageTool: Cobertura
              summaryFileLocation: 'backend/coverage.xml'
            displayName: 'Publish coverage results'
            condition: succeededOrFailed()

      - job: FrontendTests
        displayName: 'Frontend Tests'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
            displayName: 'Set up Node.js'

          - script: |
              cd frontend
              npm ci
            displayName: 'Install frontend dependencies'

          - script: |
              cd frontend
              npm run lint
            displayName: 'Run linter'

          - script: |
              cd frontend
              npm run build
            displayName: 'Build frontend'

  - stage: Build
    displayName: 'Build & Push Docker Images'
    dependsOn: Test
    condition: succeeded()
    jobs:
      - job: BuildAndPush
        displayName: 'Build and Push Images'
        steps:
          - task: Docker@2
            displayName: 'Build and push backend image'
            inputs:
              command: buildAndPush
              repository: $(BACKEND_IMAGE)
              dockerfile: 'backend/Dockerfile'
              containerRegistry: 'aifilmstudioacr'
              tags: |
                $(Build.BuildId)
                latest

          - task: Docker@2
            displayName: 'Build and push frontend image'
            inputs:
              command: buildAndPush
              repository: $(FRONTEND_IMAGE)
              dockerfile: 'frontend/Dockerfile'
              containerRegistry: 'aifilmstudioacr'
              arguments: --build-arg NEXT_PUBLIC_API_URL=https://$(BACKEND_APP).kindbay-e2b730f4.eastus.azurecontainerapps.io
              tags: |
                $(Build.BuildId)
                latest

  - stage: Deploy
    displayName: 'Deploy to Azure Container Apps'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployToAzure
        displayName: 'Deploy Backend & Frontend'
        environment: 'Production'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: 'Deploy backend to Container Apps'
                  inputs:
                    azureSubscription: $(AZURE_SUBSCRIPTION)
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      az containerapp update \
                        --name $(BACKEND_APP) \
                        --resource-group $(RESOURCE_GROUP) \
                        --image $(BACKEND_IMAGE):$(Build.BuildId)

                - task: AzureCLI@2
                  displayName: 'Deploy frontend to Container Apps'
                  inputs:
                    azureSubscription: $(AZURE_SUBSCRIPTION)
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      az containerapp update \
                        --name $(FRONTEND_APP) \
                        --resource-group $(RESOURCE_GROUP) \
                        --image $(FRONTEND_IMAGE):$(Build.BuildId)

                - task: AzureCLI@2
                  displayName: 'Verify deployment'
                  inputs:
                    azureSubscription: $(AZURE_SUBSCRIPTION)
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      echo "Backend: https://$(BACKEND_APP).kindbay-e2b730f4.eastus.azurecontainerapps.io/health"
                      echo "Frontend: https://$(FRONTEND_APP).kindbay-e2b730f4.eastus.azurecontainerapps.io"
                      sleep 30
                      curl -sf "https://$(BACKEND_APP).kindbay-e2b730f4.eastus.azurecontainerapps.io/health" || echo "Backend health check pending..."
